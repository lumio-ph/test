# One-click deploy on Render (https://render.com): New → Blueprint → pick this repo.
services:
  - type: web
    name: included-vc-reports
    runtime: docker
    plan: starter            # persistent disks need a paid instance
    healthCheckPath: /api/me
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/reports.db
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAILS       # admin email(s), comma-separated
        value: ops@included.vc
      - key: ADMIN_PASSWORD     # the admin password: choose a long one (12+ characters)
        sync: false
      - key: PUBLIC_URL         # e.g. https://included-vc-reports.onrender.com
        sync: false
      - key: SMTP_URL           # optional: only needed for the "Email link" button to send real emails
        sync: false
      - key: MAIL_FROM          # e.g. Included VC Africa <reports@included.vc>
        sync: false
      - key: SEED_DEMO
        value: "1"

  # Frame Studio (public/frame/) on its own, as a free static site: no build,
  # no server. The reports app above also serves it at /frame/.
  - type: web
    name: frame-studio
    runtime: static
    buildCommand: echo "Frame Studio has no build step"
    staticPublishPath: ./public/frame
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
