<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frame Studio</title>
    <meta name="description" content="Put your photo, logo, name and designation into a ready-made frame and download it." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=DM+Serif+Display&family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&family=Poppins:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="frame.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name" id="studio-title">Frame Studio</span>
      </div>
      <p class="topbar-hint">Everything stays on your device — nothing is uploaded.</p>
    </header>

    <main class="studio">
      <!-- Preview -->
      <section class="stage" aria-label="Preview">
        <div class="stage-toolbar">
          <div class="segmented" role="radiogroup" aria-label="Size" id="format-group">
            <button type="button" role="radio" data-format="square">Square <small>1:1</small></button>
            <button type="button" role="radio" data-format="portrait">Portrait <small>4:5</small></button>
            <button type="button" role="radio" data-format="story">Story <small>9:16</small></button>
          </div>
        </div>

        <div class="canvas-wrap" id="canvas-wrap">
          <canvas id="preview" width="1080" height="1080" tabindex="0" aria-label="Frame preview. Drag to move your photo, scroll or pinch to zoom."></canvas>
          <div class="drop-hint" id="drop-hint">Drop your photo here</div>
        </div>

        <div class="stage-controls">
          <label class="zoom">
            <span>Zoom</span>
            <input type="range" id="photo-zoom" min="1" max="4" step="0.01" value="1" />
          </label>
          <button type="button" class="btn ghost small" id="photo-reset">Recentre</button>
        </div>
        <p class="stage-hint" id="stage-hint">Drag the photo to reposition · scroll or pinch to zoom</p>
      </section>

      <!-- Controls -->
      <section class="panel" aria-label="Customise">
        <div class="step">
          <h2><span class="num">1</span> Choose a frame</h2>
          <div class="frames" id="frame-list" role="radiogroup" aria-label="Frame"></div>
          <input type="file" id="overlay-input" accept="image/png,image/svg+xml,image/webp" hidden />
        </div>

        <div class="step">
          <h2><span class="num">2</span> Your photo</h2>
          <label class="dropzone" id="photo-drop">
            <input type="file" id="photo-input" accept="image/*" />
            <span class="dz-thumb" id="photo-thumb" aria-hidden="true"></span>
            <span class="dz-text">
              <strong id="photo-label">Upload a photo</strong>
              <small>JPG or PNG · drag it here or tap to choose</small>
            </span>
          </label>
          <div class="row">
            <label class="field grow">
              <span>Brightness</span>
              <input type="range" id="photo-brightness" min="70" max="130" step="1" value="100" />
            </label>
            <label class="check">
              <input type="checkbox" id="photo-mono" />
              <span>Black &amp; white</span>
            </label>
          </div>
        </div>

        <div class="step">
          <h2><span class="num">3</span> Your details</h2>
          <label class="field">
            <span>Full name</span>
            <input type="text" id="t-name" maxlength="60" placeholder="e.g. Amara Okafor" autocomplete="name" />
          </label>
          <label class="field">
            <span>Designation</span>
            <input type="text" id="t-designation" maxlength="80" placeholder="e.g. Investment Associate, Horizon Ventures" autocomplete="organization-title" />
          </label>
          <label class="field">
            <span>Headline</span>
            <input type="text" id="t-headline" maxlength="48" placeholder="e.g. Proud Fellow · Investment Cohort" />
          </label>
          <label class="field">
            <span>Tag line <small>optional</small></span>
            <input type="text" id="t-tag" maxlength="40" placeholder="e.g. #IncludedVCAfrica" />
          </label>
          <div class="field overlay-only" id="overlay-text-controls">
            <span>Text on custom frame</span>
            <div class="row">
              <label class="field grow">
                <span>Vertical position</span>
                <input type="range" id="overlay-text-y" min="5" max="95" step="1" value="84" />
              </label>
              <label class="field">
                <span>Colour</span>
                <input type="color" id="overlay-text-color" value="#ffffff" />
              </label>
            </div>
            <label class="check">
              <input type="checkbox" id="overlay-text-show" checked />
              <span>Show name &amp; designation</span>
            </label>
          </div>
        </div>

        <div class="step">
          <h2><span class="num">4</span> Logo</h2>
          <label class="dropzone compact" id="logo-drop">
            <input type="file" id="logo-input" accept="image/*" />
            <span class="dz-thumb logo" id="logo-thumb" aria-hidden="true"></span>
            <span class="dz-text">
              <strong id="logo-label">Upload a logo</strong>
              <small>A transparent PNG looks best</small>
            </span>
          </label>
          <div class="field">
            <span>Position</span>
            <div class="segmented wide" role="radiogroup" aria-label="Logo position" id="logo-pos">
              <button type="button" role="radio" data-pos="tl" title="Top left">↖</button>
              <button type="button" role="radio" data-pos="tr" title="Top right">↗</button>
              <button type="button" role="radio" data-pos="bl" title="Bottom left">↙</button>
              <button type="button" role="radio" data-pos="br" title="Bottom right">↘</button>
            </div>
          </div>
          <div class="row">
            <label class="field grow">
              <span>Size</span>
              <input type="range" id="logo-size" min="0.6" max="1.6" step="0.01" value="1" />
            </label>
          </div>
          <div class="row wrap">
            <label class="check">
              <input type="checkbox" id="logo-chip" checked />
              <span>White backing</span>
            </label>
            <label class="check">
              <input type="checkbox" id="logo-knockout" />
              <span>Remove white background</span>
            </label>
            <button type="button" class="btn ghost small" id="logo-remove">Remove logo</button>
          </div>
        </div>

        <div class="step">
          <h2><span class="num">5</span> Style</h2>
          <div class="field">
            <span>Colour theme</span>
            <div class="swatches" id="theme-list" role="radiogroup" aria-label="Colour theme"></div>
          </div>
          <div class="row">
            <label class="field color">
              <span>Main</span>
              <input type="color" id="c-primary" />
            </label>
            <label class="field color">
              <span>Second</span>
              <input type="color" id="c-secondary" />
            </label>
            <label class="field color">
              <span>Accent</span>
              <input type="color" id="c-accent" />
            </label>
          </div>
          <label class="field">
            <span>Headline font</span>
            <select id="font-select">
              <option value="Archivo">Archivo — bold &amp; modern</option>
              <option value="Poppins">Poppins — friendly</option>
              <option value="Space Grotesk">Space Grotesk — techy</option>
              <option value="Playfair Display">Playfair Display — elegant</option>
              <option value="DM Serif Display">DM Serif Display — classic</option>
            </select>
          </label>
        </div>

        <div class="step download">
          <h2><span class="num">6</span> Download</h2>
          <div class="row">
            <select id="export-type" aria-label="File type">
              <option value="png">PNG · best quality</option>
              <option value="jpeg">JPG · smaller file</option>
            </select>
            <button type="button" class="btn primary grow" id="download">Download image</button>
          </div>
          <button type="button" class="btn ghost" id="share" hidden>Share…</button>
          <p class="fine" id="export-info"></p>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="config.js"></script>
    <script src="frame.js"></script>
  </body>
</html>
